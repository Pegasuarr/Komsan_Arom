version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: melodyhub-postgres
    restart: always
    environment:
      POSTGRES_DB: melodyhub_db
      POSTGRES_USER: melodyhub_user
      POSTGRES_PASSWORD: melodyhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melodyhub_user -d melodyhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
